services:
  gitnotes:
    image: ghcr.io/1800alex/gitnotes:latest
    container_name: gitnotes
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Run the process as the host user so commits/SSH/file ownership match
      # the bind-mounted repo. Defaults to your account in .env.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Sign tokens with a persistent secret so logins survive restarts.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      TOKEN_TTL_HOURS: "${TOKEN_TTL_HOURS:-720}"
      # Optional commit identity override (otherwise the mounted .gitconfig is used).
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-}"
      AUTO_PUSH: "${AUTO_PUSH:-true}"
      AUTO_PULL: "${AUTO_PULL:-true}"
    volumes:
      # --- Repos ---
      # Each git-backed repo you want to expose is a bind mount; reference its
      # CONTAINER path (right side) from users.json. A repo is "shared" by
      # listing the same container path in multiple users' repos.
      #
      # Add more repos as needed, e.g.:
      # - "/home/user/work-notes:/data/work-notes"
      # - "/home/user/notes:/data/sam-notes"

      # Accounts + per-user repo lists (see users.example.json).
      - "${USERS_FILE:-./users.json}:/data/users.json:ro"
      # SSH keys + known_hosts for pushing/pulling over git@… remotes.
      # NOTE: compose does not expand "~"; ${HOME} is expanded from your shell.
      - "${SSH_DIR:-${HOME}/.ssh}:/home/appuser/.ssh:ro"
      # Git identity / config.
      - "${GITCONFIG:-${HOME}/.gitconfig}:/home/appuser/.gitconfig:ro"
