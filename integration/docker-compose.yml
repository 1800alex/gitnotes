# Integration-test stack — isolated from dev/ and testdata/ (own name + port).
# Serves the freshly-seeded dummy repo with throwaway accounts. run.sh builds
# this, waits for readiness, runs Playwright against it, then tears it down.
services:
  app:
    build: ..
    image: notes-itest
    container_name: notes-itest
    restart: "no"
    ports:
      - "${ITEST_PORT:-8091}:8080"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      JWT_SECRET: "itest-secret-not-for-prod"
      GIT_AUTHOR_NAME: "Notes ITest"
      GIT_AUTHOR_EMAIL: "itest@example.com"
      AUTO_PUSH: "false"
      AUTO_PULL: "false"
    volumes:
      - ./repo:/data/repo
      # A second repo, so multi-repo access control can be exercised. `admin`
      # can reach both; `user` only reaches the shared main repo.
      - ./work:/data/work
      - ./users.itest.json:/data/users.json:ro
