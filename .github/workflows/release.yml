name: release

# Builds and publishes the notes app image whenever a tag matching v* is pushed:
#   * ghcr.io/<owner>/gitnotes  (multi-arch: linux/amd64 + linux/arm64)
# and creates a GitHub Release with auto-generated notes.
#
# Example: `git tag v1.0.0 && git push origin v1.0.0`
# Uses the built-in GITHUB_TOKEN — no secrets to configure.
# (You can also trigger a build manually from the Actions tab.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

jobs:
  image:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gitnotes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: publish GitHub release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image (linux/amd64 + linux/arm64):

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/gitnotes:${{ github.ref_name }}
            ```
